<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MyBank</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- LOGIN PAGE -->
    <section id="loginPage" class="page login-page">

        <div class="logo">
            <div class="logo-icon">₦</div>
            <h1>MyBank</h1>
        </div>

        <div class="login-box">

            <h2>Welcome Back 👋</h2>
            <p>Login to your account</p>

            <label>Username</label>
            <input type="text" id="username" placeholder="Enter username">

            <label>Password</label>

            <div class="password-box">
                <input type="password" id="password" placeholder="Enter password">
                <button onclick="showPassword()">👁</button>
            </div>

            <button class="primary-btn" onclick="login()">
                Login
            </button>

            <p id="loginError" class="error"></p>

        </div>

    </section>


    <!-- MAIN APP -->
    <section id="appPage" class="page app-page hidden">

        <!-- HEADER -->
        <header>

            <div>
                <small>Welcome back</small>
                <h2 id="userNameDisplay">User</h2>
            </div>

            <button class="profile-btn" onclick="logout()">
                👤
            </button>

        </header>


        <!-- BALANCE CARD -->
        <div class="balance-card">

            <div class="balance-top">
                <span>Total Balance</span>
                <button onclick="toggleBalance()">👁</button>
            </div>

            <h1 id="balance">₦250,000.00</h1>

            <div class="account-number">
                <span>Account</span>
                <strong>**** 4821</strong>
            </div>

        </div>


        <!-- QUICK ACTIONS -->
        <div class="actions">

            <button onclick="openTransfer()">
                <span>↗</span>
                Transfer
            </button>

            <button onclick="showMessage('Airtime feature coming soon')">
                <span>📱</span>
                Airtime
            </button>

            <button onclick="showMessage('Bills feature coming soon')">
                <span>💡</span>
                Bills
            </button>

            <button onclick="showMessage('More services coming soon')">
                <span>•••</span>
                More
            </button>

        </div>


        <!-- TRANSACTIONS -->
        <div class="section-title">

            <h3>Recent Transactions</h3>

            <button onclick="showAllTransactions()">
                See all
            </button>

        </div>

        <div id="transactions">

            <div class="transaction">
                <div class="transaction-icon received">
                    ↓
                </div>

                <div class="transaction-info">
                    <strong>Salary</strong>
                    <small>Today • 10:30 AM</small>
                </div>

                <strong class="green">
                    +₦50,000
                </strong>
            </div>


            <div class="transaction">
                <div class="transaction-icon sent">
                    ↑
                </div>

                <div class="transaction-info">
                    <strong>John Doe</strong>
                    <small>Yesterday • 4:12 PM</small>
                </div>

                <strong class="red">
                    -₦10,000
                </strong>
            </div>


            <div class="transaction">
                <div class="transaction-icon sent">
                    ↑
                </div>

                <div class="transaction-info">
                    <strong>Electricity</strong>
                    <small>20 Sep • 2:30 PM</small>
                </div>

                <strong class="red">
                    -₦7,500
                </strong>
            </div>

        </div>


        <!-- BOTTOM NAVIGATION -->
        <nav>

            <button class="active">
                <span>⌂</span>
                Home
            </button>

            <button onclick="openTransfer()">
                <span>↗</span>
                Transfer
            </button>

            <button onclick="showMessage('Cards coming soon')">
                <span>▣</span>
                Cards
            </button>

            <button onclick="showMessage('Profile coming soon')">
                <span>👤</span>
                Profile
            </button>

        </nav>

    </section>


    <!-- TRANSFER MODAL -->
    <div id="transferModal" class="modal hidden">

        <div class="modal-box">

            <button class="close" onclick="closeTransfer()">×</button>

            <h2>Send Money</h2>
            <p>Demo transfer</p>

            <label>Account Number</label>
            <input
                type="number"
                id="accountNumber"
                placeholder="Enter account number"
            >

            <label>Amount</label>
            <input
                type="number"
                id="transferAmount"
                placeholder="₦0.00"
            >

            <label>Description</label>
            <input
                type="text"
                id="description"
                placeholder="What's this for?"
            >

            <button class="primary-btn" onclick="transferMoney()">
                Continue
            </button>

        </div>

    </div>


    <div id="toast"></div>

    <script src="script.js"></script>

</body>
</html>
